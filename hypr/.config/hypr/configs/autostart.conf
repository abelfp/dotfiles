# vim: filetype=hyprlang
#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar & swaync & hypridle & hyprpaper
exec-once = hyprsunset
exec-once = solaar -w hide
exec-once = fcitx5
exec-once = dropbox

# set up for each workspace
# Terminal (default)
exec-once = [workspace 1 silent] $terminal -e tmux new -s MAIN

# browser
exec-once = [workspace 2 silent] $webBrowser

# Calendar and email
# to start a kitty window and run a command without terminating the window, you
# can use `--hold` like so `kitty -e --hold command`
exec-once = [workspace 8 silent] $terminal -e neomutt

# Config files
exec-once = [workspace 9 silent] $terminal --directory ~/dotfiles
